<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Mission control and the crew tablet linked live; a route change re-plans only the part ahead of the crew</title>
  <defs>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
    <marker id="arrow-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#007b83"/></marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#ffffff"/>

  <!-- Crew tablet -->
  <g transform="translate(40,32)">
    <rect width="250" height="150" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/>
    <rect x="22" y="22" width="56" height="74" rx="8" fill="none" stroke="#202124" stroke-width="3"/>
    <line x1="42" y1="86" x2="58" y2="86" stroke="#202124" stroke-width="3" stroke-linecap="round"/>
    <text x="96" y="46" font-size="16" font-weight="700" fill="#202124">Crew tablet</text>
    <text x="96" y="68" font-size="13" fill="#5f6368">on the walk</text>
    <text x="22" y="124" font-size="13" fill="#3c4043">plays the walk, position fixes,</text>
    <text x="22" y="142" font-size="13" fill="#3c4043">stay longer, drop a stop</text>
  </g>

  <!-- Mission control -->
  <g transform="translate(670,32)">
    <rect width="250" height="150" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/>
    <g transform="translate(50,58)" stroke="#202124" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="0" y1="4" x2="0" y2="38"/><line x1="-12" y1="38" x2="12" y2="38"/>
      <circle cx="0" cy="0" r="5"/>
      <path d="M-13,-12 a18,18 0 0 0 0,24 M13,-12 a18,18 0 0 1 0,24"/>
      <path d="M-22,-21 a30,30 0 0 0 0,42 M22,-21 a30,30 0 0 1 0,42"/>
    </g>
    <text x="96" y="46" font-size="16" font-weight="700" fill="#202124">Mission control</text>
    <text x="96" y="68" font-size="13" fill="#5f6368">in the habitat</text>
    <text x="22" y="124" font-size="13" fill="#3c4043">follows the crew, drafts changes,</text>
    <text x="22" y="142" font-size="13" fill="#3c4043">judges them GO / NO-GO first</text>
  </g>

  <!-- Link -->
  <line x1="300" y1="80" x2="660" y2="80" stroke="#1a73e8" stroke-width="3" marker-end="url(#arrow-b)"/>
  <text x="480" y="68" font-size="14" font-weight="600" fill="#1a73e8" text-anchor="middle">crew position, ~30 times a second</text>
  <line x1="660" y1="134" x2="300" y2="134" stroke="#007b83" stroke-width="3" marker-end="url(#arrow-t)"/>
  <text x="480" y="158" font-size="14" font-weight="600" fill="#007b83" text-anchor="middle">route change + message for the crew</text>
  <text x="480" y="108" font-size="12" fill="#5f6368" text-anchor="middle">live link: browser BroadcastChannel (SIMULATED suit radio)</text>

  <!-- Re-plan strip -->
  <text x="40" y="232" font-size="16" font-weight="700" fill="#202124">What a change does to the route</text>
  <text x="40" y="254" font-size="13" fill="#5f6368">Example: mission control drops stop 3 while the crew walks towards it.</text>
  <g transform="translate(40,270)">
    <rect width="880" height="150" rx="12" fill="#eef0f1"/>
    <!-- walked -->
    <polyline points="30,110 120,90 210,98 300,80" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="30,110 120,90 210,98 300,80" fill="none" stroke="#9aa0a6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- old plan ahead (faded) -->
    <polyline points="300,80 380,62 470,40 560,34" fill="none" stroke="#1a73e8" stroke-width="5" stroke-opacity="0.35" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="560,34 660,60 760,88 850,104" fill="none" stroke="#1a73e8" stroke-width="5" stroke-opacity="0.35" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="560" cy="34" r="12" fill="#fff" stroke="#9aa0a6" stroke-width="3"/>
    <path d="M553,27 L567,41 M567,27 L553,41" stroke="#d93025" stroke-width="3" stroke-linecap="round"/>
    <text x="580" y="28" font-size="12.5" font-weight="600" fill="#d93025">stop 3 dropped</text>
    <!-- new rest (teal dashed) from the cut -->
    <polyline points="340,72 440,86 560,96 680,104 850,104" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="340,72 440,86 560,96 680,104 850,104" fill="none" stroke="#007b83" stroke-width="6" stroke-dasharray="12 8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- crew and cut -->
    <circle cx="300" cy="80" r="10" fill="#188038" stroke="#fff" stroke-width="3"/>
    <line x1="340" y1="56" x2="340" y2="90" stroke="#202124" stroke-width="2"/>
    <text x="300" y="138" font-size="12.5" fill="#3c4043" text-anchor="middle">crew</text>
    <text x="350" y="50" font-size="12.5" fill="#3c4043">cut ~20 m ahead</text>
    <!-- home -->
    <circle cx="850" cy="104" r="11" fill="#202124" stroke="#fff" stroke-width="3"/>
    <circle cx="850" cy="104" r="4" fill="#fff"/>
    <text x="850" y="138" font-size="12.5" fill="#3c4043" text-anchor="middle">habitat</text>
    <text x="150" y="128" font-size="12.5" font-weight="600" fill="#5f6368" text-anchor="middle">walked part: kept exactly</text>
    <text x="600" y="128" font-size="12.5" font-weight="600" fill="#007b83" text-anchor="middle">new rest of the walk: GO, back 21 min earlier</text>
  </g>
  <text x="40" y="450" font-size="13" fill="#3c4043">The cut sits a few metres ahead so nobody turns back. The clock does not jump: the new plan reaches the cut at the same time as the old one.</text>
</svg>
