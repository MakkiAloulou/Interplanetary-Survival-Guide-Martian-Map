<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>The point of no return: the suit's oxygen split into time walked, an emergency walk home, the margin and the reserve</title>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fce8e6"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d93025" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="960" height="340" rx="16" fill="#ffffff"/>

  <text x="40" y="44" font-size="17" font-weight="700" fill="#202124">8 h of suit O₂, checked at every point of the route</text>
  <text x="40" y="66" font-size="13.5" fill="#5f6368">Bars to scale. The emergency walk home is assumed 1.5× slower than planned (tired, carrying kit, worse ground).</text>

  <!-- scale: x from 40 to 920 = 880 px for 480 min -->
  <!-- Row A: T+3:00, walk home planned 60 min -> 90 min -->
  <text x="40" y="106" font-size="14" font-weight="700" fill="#202124">At T+3:00 on the route</text>
  <g transform="translate(40,116)">
    <rect x="0" y="0" width="330" height="40" rx="6" fill="#9aa0a6"/>
    <rect x="330" y="0" width="165" height="40" fill="#f9ab00"/>
    <rect x="495" y="0" width="330" height="40" fill="#188038"/>
    <rect x="825" y="0" width="55" height="40" rx="6" fill="url(#hatch)"/>
    <text x="14" y="26" font-size="14" font-weight="600" fill="#fff">walked: 3 h</text>
    <text x="344" y="26" font-size="14" font-weight="600" fill="#202124">walk home ×1.5: 1 h 30</text>
    <text x="509" y="26" font-size="14" font-weight="600" fill="#fff">margin: 3 h → GO, carry on</text>
  </g>

  <!-- Row B: point of no return -->
  <text x="40" y="196" font-size="14" font-weight="700" fill="#202124">At the point of no return</text>
  <g transform="translate(40,206)">
    <rect x="0" y="0" width="605" height="40" rx="6" fill="#9aa0a6"/>
    <rect x="605" y="0" width="220" height="40" fill="#f9ab00"/>
    <rect x="825" y="0" width="55" height="40" rx="6" fill="url(#hatch)"/>
    <text x="14" y="26" font-size="14" font-weight="600" fill="#fff">walked: 5 h 30</text>
    <text x="619" y="26" font-size="14" font-weight="600" fill="#202124">walk home ×1.5: 2 h</text>
    <line x1="825" y1="-14" x2="825" y2="54" stroke="#d93025" stroke-width="3"/>
    <text x="815" y="72" font-size="13.5" font-weight="700" fill="#d93025" text-anchor="end">margin 0 → turn back now</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#3c4043" transform="translate(40,312)">
    <rect x="0" y="-11" width="14" height="14" rx="3" fill="#9aa0a6"/><text x="22" y="1">time walked</text>
    <rect x="130" y="-11" width="14" height="14" rx="3" fill="#f9ab00"/><text x="152" y="1">emergency walk home to the nearest safe haven (habitat or rover)</text>
    <rect x="590" y="-11" width="14" height="14" rx="3" fill="#188038"/><text x="612" y="1">margin</text>
    <rect x="690" y="-11" width="14" height="14" rx="3" fill="url(#hatch)"/><text x="712" y="1">30 min reserve, never used</text>
  </g>
</svg>
